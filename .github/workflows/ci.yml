name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.3', '8.4', '8.5' ]
        dependencies: [ 'lowest', 'highest' ]
        # Lowest-deps are resolved against the minimum PHP only: the oldest
        # allowed dependency versions predate PHP 8.4 and emit engine-level
        # deprecations there (implicit-nullable params, E_STRICT) that the
        # strict phpunit config turns into failures. They are clean on 8.3.
        exclude:
          - php: '8.4'
            dependencies: 'lowest'
          - php: '8.5'
            dependencies: 'lowest'
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Static analysis
        if: matrix.dependencies == 'highest'
        run: composer phpstan

      - name: Tests
        run: composer test
